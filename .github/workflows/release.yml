name: Build and Release

on:
  push:
    branches:
      - master
      - dev
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.gen.outputs.app_version }}
      release_tag: ${{ steps.gen.outputs.release_tag }}
      release_name: ${{ steps.gen.outputs.release_name }}
      is_prerelease: ${{ steps.gen.outputs.is_prerelease }}
      update_tag: ${{ steps.gen.outputs.update_tag }}
    steps:
      - name: Calculate version
        id: gen
        run: |
          DATE_STR=$(TZ=Asia/Tokyo date +'%Y.%m.%d')
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            RELEASE_TAG="${{ github.ref_name }}"
            RELEASE_NAME="${{ github.ref_name }}"
            IS_PRERELEASE="false"
            UPDATE_TAG="false"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            VERSION="dev-v${DATE_STR}.${{ github.run_number }}"
            RELEASE_TAG="dev-latest"
            RELEASE_NAME="${VERSION}"
            IS_PRERELEASE="true"
            UPDATE_TAG="true"
          else
            VERSION="v${DATE_STR}.${{ github.run_number }}"
            RELEASE_TAG="latest"
            RELEASE_NAME="${VERSION}"
            IS_PRERELEASE="true"
            UPDATE_TAG="true"
          fi
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "update_tag=${UPDATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated version: ${VERSION} (tag: ${RELEASE_TAG})"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows/amd64
            artifact: osuccgate-windows-amd64.exe
          - runner: ubuntu-22.04
            platform: linux/amd64
            artifact: osuccgate-linux-amd64.tar.gz

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libpcsclite-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: osuccgate/go.mod
          cache-dependency-path: osuccgate/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build application (Linux)
        if: runner.os == 'Linux'
        working-directory: osuccgate
        run: wails build --clean --platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-X main.appVersion=${{ needs.version.outputs.app_version }}"

      - name: Build application (Windows)
        if: runner.os == 'Windows'
        working-directory: osuccgate
        run: wails build --clean --platform ${{ matrix.platform }} -ldflags "-X main.appVersion=${{ needs.version.outputs.app_version }}"

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }} -C osuccgate/build/bin osuccgate

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item osuccgate/build/bin/osuccgate.exe ${{ matrix.artifact }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: ${{ needs.version.outputs.release_name }}
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          update_tag: ${{ needs.version.outputs.update_tag == 'true' }}
          generate_release_notes: true
          files: release-assets/*
